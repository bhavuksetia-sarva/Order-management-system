<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sarva Foam — Order Management</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#E9EDEE; --panel:#FFFFFF; --ink:#16211F; --ink-soft:#4B5A57;
    --line:#C7D0D1; --accent:#E8601C; --accent-ink:#7A2E10;
    --positive:#146B5C; --positive-bg:#E4F1EE;
    --negative:#B23A2E; --negative-bg:#FBEAE7;
    --field-bg:#F4F6F6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{background:var(--ink);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  header .left{display:flex;align-items:baseline;gap:14px;}
  header .wordmark{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.02em;}
  header .sub{color:#9FB0AC;font-size:12.5px;}
  header .right{display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9FB0AC;}
  nav{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 24px;}
  nav button{border:none;background:none;padding:14px 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;font-family:'IBM Plex Sans',sans-serif;}
  nav button.active{color:var(--accent-ink);border-bottom-color:var(--accent);}
  main{max-width:1180px;margin:0 auto;padding:26px 24px 60px;}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start;}
  @media (max-width:920px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:18px;}
  .card h2{font-size:13px;margin:0 0 14px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:10px;}
  .card h2 .subtitle{font-weight:400;color:var(--ink-soft);font-size:11.5px;text-transform:none;letter-spacing:0;margin-left:8px;}
  .field-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;margin-bottom:14px;align-items:end;}
  .field-row.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:640px){.field-row,.field-row.cols-2{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  select,input{background:var(--field-bg);border:1px solid var(--line);border-radius:2px;padding:8px 9px;font-size:13.5px;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;width:100%;box-sizing:border-box;}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;}
  /* searchable select — a text input + filtered dropdown panel standing in
     for a native <select> on long lists (customers, products) */
  .ssel{position:relative;}
  .ssel input{cursor:text;}
  .ssel-panel{display:none;position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-height:230px;overflow-y:auto;}
  .ssel-panel.open{display:block;}
  .ssel-opt{padding:8px 10px;font-size:13px;cursor:pointer;}
  .ssel-opt:hover,.ssel-opt.hi{background:var(--field-bg);}
  .ssel-empty{padding:8px 10px;font-size:12.5px;color:var(--ink-soft);}
  .order-type-tabs,.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .order-type-tabs button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 12px;border-radius:2px;border:1px solid var(--line);background:var(--field-bg);color:var(--ink-soft);cursor:pointer;}
  .order-type-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .subtabs button{font-size:12.5px;padding:7px 12px;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer;}
  .subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);}
  td{padding:7px 8px;border-bottom:1px solid #EEF1F1;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:2px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .add-line{background:none;border:1px dashed var(--line);color:var(--ink-soft);padding:7px 10px;border-radius:2px;cursor:pointer;font-size:12.5px;}
  .summary-line{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
  .summary-line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:15px;}
  .pos{color:var(--positive);} .neg{color:var(--negative);}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 7px;border-radius:2px;background:var(--field-bg);color:var(--ink-soft);border:1px solid var(--line);}
  .badge.delivered{background:var(--positive-bg);color:var(--positive);border-color:transparent;}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media (max-width:820px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 18px;}
  .kpi .label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .helptext{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .warn-box{background:var(--negative-bg);border:1px solid #EAC3BD;color:var(--accent-ink);padding:10px 12px;border-radius:2px;font-size:12.5px;margin-bottom:12px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:14px 0;}
  .order-row{cursor:pointer;}
  #login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:32px 36px;width:340px;}
  .login-card h1{font-size:15px;margin:0 0 4px;}
  .login-card .sub{font-size:12px;color:var(--ink-soft);margin-bottom:20px;}
  .login-card .field{margin-bottom:14px;}
  .login-card .btn{width:100%;margin-top:6px;}
  .login-err{color:var(--negative);font-size:12.5px;margin-top:10px;min-height:16px;}
  #app-shell{display:none;}
  .loading{padding:30px;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>SARVA FOAM — Order Management</h1>
    <div class="sub">Sign in with your staff account</div>
    <div class="field"><label>Email</label><input type="email" id="login-email"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password"></div>
    <button class="btn" id="login-btn">Sign in</button>

</div>

<div id="app-shell">

    </div>
    <div class="right">

    </div>
  </header>
  <nav>
    <button class="active" data-view="order">Place Order</button>
    <button data-view="orderlist">Order Book</button>

  </nav>

</div>

<script>

function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

/* =====================================================================
   AUTH
   ===================================================================== */
async function checkAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showApp(session); } else { showLogin(); }
}
function showLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-shell').style.display = 'none';
}
async function showApp(session){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  document.getElementById('user-email').textContent = session.user.email;
  await loadReferenceData();

/* =====================================================================
   REFERENCE DATA — fetched once after login, used for dropdowns/lookups only.
   Nothing here duplicates business logic — pricing/costing/invoicing all
   happen in Postgres (triggers), never in this file.
   ===================================================================== */
let PRODUCTS=[], CUSTOMERS=[], AGENTS=[], WAREHOUSES=[], PRODUCTION_UNITS=[];
let CUSTOMER_ADDRESSES=[];
let CUSTOMER_DEFAULT_AGENT={}, CUSTOMER_COMMISSION_PCT={};
let SELLING_PRICES=[]; // {product_id, customer_id, transaction_type, price_per_roll_gbp, effective_date}
let EX_FACTORY_PRICES=[]; // {product_id, unit_id, price_gbp, effective_date}

async function loadReferenceData(){
  const [p, c, a, w, u, ca, cac, sp, ep] = await Promise.all([
    sb.from('products').select('id,sku_name').eq('is_active', true).order('sku_name'),
    sb.from('customers').select('id,name,is_warehouse_destination,linked_warehouse_id').order('name'),
    sb.from('agents').select('id,name').order('name'),
    sb.from('warehouses').select('id,name').eq('is_active', true).order('name'),
    sb.from('production_units').select('id,name').eq('is_active', true).order('name'),
    sb.from('customer_delivery_addresses').select('customer_id,address,is_default'),
    sb.from('customer_agent_commission').select('customer_id,agent_id,commission_pct,effective_date').order('effective_date', {ascending:false}),
    sb.from('selling_prices').select('product_id,customer_id,transaction_type,price_per_roll_gbp,effective_date'),
    sb.from('ex_factory_prices').select('product_id,unit_id,price_gbp,effective_date'),
  ]);
  PRODUCTS = p.data || []; CUSTOMERS = c.data || []; AGENTS = a.data || [];
  WAREHOUSES = w.data || []; PRODUCTION_UNITS = u.data || [];
  CUSTOMER_ADDRESSES = ca.data || [];
  SELLING_PRICES = sp.data || [];
  EX_FACTORY_PRICES = ep.data || [];
  CUSTOMER_DEFAULT_AGENT = {}; CUSTOMER_COMMISSION_PCT = {};
  (cac.data || []).forEach(row => {
    // sorted by effective_date desc above, so the first hit per customer is the current agent/commission
    if(!(row.customer_id in CUSTOMER_DEFAULT_AGENT)){
      CUSTOMER_DEFAULT_AGENT[row.customer_id] = row.agent_id;
      CUSTOMER_COMMISSION_PCT[row.customer_id] = row.commission_pct;
    }
  });
}
function productName(id){ return PRODUCTS.find(x=>x.id===id)?.sku_name || id; }
function customerName(id){ return CUSTOMERS.find(x=>x.id===id)?.name || id; }
function agentName(id){ return AGENTS.find(x=>x.id===id)?.name || '—'; }
function warehouseName(id){ return WAREHOUSES.find(x=>x.id===id)?.name || id; }
function unitName(id){ return PRODUCTION_UNITS.find(x=>x.id===id)?.name || '—'; }
function addressesForCustomer(customerId){ return CUSTOMER_ADDRESSES.filter(a=>a.customer_id===customerId); }
// Mirrors fn_selling_price(): most recent effective_date <= asOf, for this
// exact (product, customer, transaction_type). Returns null if none on file —
// callers should show that plainly rather than guess, matching how the real
// invoicing trigger bills £0 + a pricing_warnings row when this happens.
function sellingPrice(productId, customerId, transactionType, asOf){
  const rows = SELLING_PRICES.filter(r=>r.product_id===productId && r.customer_id===customerId
    && r.transaction_type===transactionType && r.effective_date<=asOf)
    .sort((a,b)=>b.effective_date.localeCompare(a.effective_date));
  return rows.length ? rows[0].price_per_roll_gbp : null;
}
// Mirrors fn_ex_factory_price() exactly, including its fallback to any
// unit's price if none is on file for the specific plant. CONFIRMED: no
// freezing — this is called live, every render, driven by dispatch_date.
// Callers must separately enforce "no dispatch_date -> £0" themselves,
// matching v_direct_profit's rule (this function alone doesn't know that
// rule, since dispatch_date might legitimately be null for other reasons).
function exFactoryPrice(productId, unitId, asOf){
  if(unitId){
    const rows = EX_FACTORY_PRICES.filter(r=>r.product_id===productId && r.unit_id===unitId && r.effective_date<=asOf)
      .sort((a,b)=>b.effective_date.localeCompare(a.effective_date));
    if(rows.length) return rows[0].price_gbp;
    const earliestForUnit = EX_FACTORY_PRICES.filter(r=>r.product_id===productId && r.unit_id===unitId)
      .sort((a,b)=>a.effective_date.localeCompare(b.effective_date))[0];
    if(earliestForUnit) return earliestForUnit.price_gbp;
  }
  const anyRows = EX_FACTORY_PRICES.filter(r=>r.product_id===productId && r.effective_date<=asOf)
    .sort((a,b)=>b.effective_date.localeCompare(a.effective_date));
  return anyRows.length ? anyRows[0].price_gbp : null;
}
function optionsHtml(list, labelFn, selected){
  return list.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${labelFn(x)}</option>`).join('');
}
// Searchable select — stands in for a native <select> on long lists
// (customers, products). Renders a visible text input for searching plus a
// HIDDEN input carrying the real id under the ORIGINAL field id, so every
// existing document.getElementById(id).value read elsewhere keeps working
// unchanged. Call renderSearchableSelect() in the template, then
// wireSearchableSelect() right after inserting that HTML into the DOM.
function renderSearchableSelect(id, list, labelFn, selected, placeholder){
  const selectedItem = selected ? list.find(x=>x.id===selected) : null;
  const label = selectedItem ? labelFn(selectedItem) : '';
  return `<div class="ssel">
    <input type="text" id="${id}-search" value="${label}" placeholder="${placeholder||'Type to search…'}" autocomplete="off">
    <input type="hidden" id="${id}" value="${selected||''}">
    <div class="ssel-panel" id="${id}-panel"></div>
  </div>`;
}
function wireSearchableSelect(id, list, labelFn, onChange){
  const searchInput = document.getElementById(id+'-search');
  const hiddenInput = document.getElementById(id);
  const panel = document.getElementById(id+'-panel');
  if(!searchInput || !panel) return;
  let hiIdx = -1;

  function renderPanel(filterText){
    const term = (filterText||'').toLowerCase();
    const filtered = list.filter(x=>labelFn(x).toLowerCase().includes(term));
    panel.innerHTML = filtered.length
      ? filtered.slice(0,50).map((x,i)=>`<div class="ssel-opt" data-idx="${i}" data-value="${x.id}">${labelFn(x)}</div>`).join('')
      : `<div class="ssel-empty">No matches</div>`;
    panel.classList.add('open');
    hiIdx = -1;
    panel.querySelectorAll('.ssel-opt').forEach(el=>el.addEventListener('mousedown', e=>{
      e.preventDefault(); // fires before blur, so the click registers before the panel closes
      selectOption(el.dataset.value, el.textContent);
    }));
  }
  function selectOption(value, label){
    hiddenInput.value = value;
    searchInput.value = label;
    panel.classList.remove('open');
    if(onChange) onChange(value);
  }
  function updateHi(opts){
    opts.forEach((o,i)=>o.classList.toggle('hi', i===hiIdx));
    if(opts[hiIdx]) opts[hiIdx].scrollIntoView({block:'nearest'});
  }
  searchInput.addEventListener('focus', ()=>renderPanel(''));
  searchInput.addEventListener('input', ()=>renderPanel(searchInput.value));
  searchInput.addEventListener('blur', ()=>{ setTimeout(()=>panel.classList.remove('open'), 150); });
  searchInput.addEventListener('keydown', e=>{
    const opts = [...panel.querySelectorAll('.ssel-opt')];
    if(e.key==='ArrowDown'){ e.preventDefault(); hiIdx=Math.min(hiIdx+1,opts.length-1); updateHi(opts); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hiIdx=Math.max(hiIdx-1,0); updateHi(opts); }
    else if(e.key==='Enter'){ e.preventDefault(); if(opts[hiIdx]) selectOption(opts[hiIdx].dataset.value, opts[hiIdx].textContent); }
    else if(e.key==='Escape'){ panel.classList.remove('open'); }
  });
}

/* =====================================================================
   NAV
   ===================================================================== */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click', async ()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-orderdetail').style.display='none';
  ['order','orderlist','dashboard'].forEach(v=>document.getElementById('view-'+v).style.display = (v===b.dataset.view?'block':'none'));
  if(b.dataset.view==='orderlist') await renderOrderList();
  if(b.dataset.view==='dashboard') await renderDashboard();
}));

/* =====================================================================
   PLACE ORDER
   ===================================================================== */
let currentOrderType = 'direct';
let draftItems = [];

function renderOrderView(){
  const el = document.getElementById('view-order');
  const today = todayStr();
  el.innerHTML = `
    <div class="card">
      <h2>Order type</h2>
      <div class="order-type-tabs">
        <button data-t="direct" class="${currentOrderType==='direct'?'active':''}">Direct container → customer</button>
        <button data-t="warehouse_bound" class="${currentOrderType==='warehouse_bound'?'active':''}">Container → warehouse</button>
        <button data-t="local" class="${currentOrderType==='local'?'active':''}">Local delivery from warehouse</button>
        <button data-t="transfer" class="${currentOrderType==='transfer'?'active':''}">Warehouse → warehouse transfer</button>
      </div>
    </div>
    <div class="grid">
      <div><div class="card" id="order-form-card"></div></div>
      <div><div class="card" id="order-summary-card"><h2>Order summary</h2><div class="empty">Add at least one line item to see it here.</div></div></div>
    </div>
  `;
  el.querySelectorAll('.order-type-tabs button').forEach(b=>b.addEventListener('click', ()=>{
    currentOrderType = b.dataset.t; draftItems=[]; renderOrderView();
  }));
  renderOrderForm(today);
}

function renderOrderForm(today){
  const formCard = document.getElementById('order-form-card');
  const isTransfer = currentOrderType==='transfer';
  const isLocal = currentOrderType==='local';
  const isWarehouseBound = currentOrderType==='warehouse_bound';
  const customerOptions = isWarehouseBound ? CUSTOMERS.filter(c=>c.is_warehouse_destination) : CUSTOMERS.filter(c=>!c.is_warehouse_destination);
  const defaultUnitId = PRODUCTION_UNITS.find(u=>u.name==='Silvassa')?.id;

  formCard.innerHTML = `
    <h2>${ {direct:'Direct container', warehouse_bound:'Container to warehouse', local:'Local delivery order', transfer:'Inter-warehouse transfer'}[currentOrderType] }</h2>
    <div class="field-row">
      ${!isTransfer ? `<div class="field"><label>${isLocal? 'Warehouse (dispatching)':'Customer'}</label>
        ${isLocal ? `<select id="f-primary">${optionsHtml(WAREHOUSES,w=>w.name)}</select>` : renderSearchableSelect('f-primary', customerOptions, c=>c.name, null, 'Search customers…')}</div>`
      : `<div class="field"><label>From warehouse</label><select id="f-from">${optionsHtml(WAREHOUSES,w=>w.name)}</select></div>
         <div class="field"><label>To warehouse</label><select id="f-to">${optionsHtml(WAREHOUSES,w=>w.name)}</select></div>`}
      ${isLocal ? `<div class="field"><label>Customer</label>${renderSearchableSelect('f-customer', customerOptions, c=>c.name, null, 'Search customers…')}</div>`:''}
      <div class="field"><label>Order date</label><input type="date" id="f-order-date" value="${today}"></div>
    </div>
    ${!isTransfer ? `<div class="field-row">
      <div class="field"><label>Customer order ID</label><input type="text" id="f-cust-order-id" placeholder="e.g. PO-4471"></div>
      <div class="field">
        <label>Delivery address</label>
        <select id="f-address-picker" style="margin-bottom:5px;display:none"></select>
        <input type="text" id="f-delivery-address">
      </div>
      <div class="field"><label>Customer requested date</label><input type="date" id="f-requested-date" value="${today}"></div>
      <div class="field"><label>Expected delivery date</label><input type="date" id="f-expected-date" value="${today}"></div>
    </div>` : ''}
    ${!isTransfer && !isLocal ? `<div class="field-row">
      <div class="field"><label>Source plant</label><select id="f-source-unit">${optionsHtml(PRODUCTION_UNITS,u=>u.name,defaultUnitId)}</select></div>
      <div class="field"><label>Expected stuffing date</label><input type="date" id="f-stuffing-date"></div>
      <div class="field"><label>Vessel date</label><input type="date" id="f-vessel-date"></div>
    </div>` : ''}
    ${!isTransfer ? `<div class="field-row">
      <div class="field"><label>Agent</label><select id="f-agent"><option value="">— none —</option>${optionsHtml(AGENTS,a=>a.name)}</select></div>
      ${!isLocal ? `<div class="field"><label>Logistics cost (£, whole container)</label><input type="number" id="f-logistics" value="0" min="0" step="1"></div>` :
        `<div class="field"><label>Vehicle no.</label><input type="text" id="f-vehicle-no"></div>
         <div class="field" style="flex-direction:row;align-items:center;gap:8px;margin-top:16px"><input type="checkbox" id="f-urgency" style="width:auto"><label style="margin:0">Urgent</label></div>`}
      <div class="field"><label>Discount (£)</label><input type="number" id="f-discount" value="0" min="0" step="1"></div>
    </div>` : `<div class="field-row"><div class="field"><label>Transfer date</label><input type="date" id="f-transfer-date" value="${today}"></div>
      <div class="field"><label>Reference no.</label><input type="text" id="f-ref" placeholder="TRF-0000"></div></div>`}
    ${!isTransfer ? `<div class="field-row">
      <div class="field"><label>Remarks</label><input type="text" id="f-remarks"></div>
    </div>` : ''}

    <h2 style="margin-top:18px">Line items</h2>
    <table><thead><tr><th>Product</th><th style="width:90px">Qty (rolls)</th>
      ${!isTransfer? '<th class="num" style="width:110px">Selling price</th>':''}
      ${!isTransfer && !isWarehouseBound? '<th style="width:130px">Special price /roll</th>':''}<th style="width:40px"></th></tr></thead>
      <tbody id="line-items-body"></tbody></table>
    <button class="add-line" id="add-line-btn" style="margin-top:8px">+ Add line item</button>

    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn" id="submit-order-btn">Place order</button>
      <span class="helptext" id="submit-msg"></span>
    </div>
  `;

  if(draftItems.length===0) draftItems.push({product_id:PRODUCTS[0]?.id, quantity:'', special_price:''});
  renderLineItems();
  document.getElementById('add-line-btn').addEventListener('click', ()=>{
    draftItems.push({product_id:PRODUCTS[0]?.id, quantity:'', special_price:''});
    renderLineItems(); updateOrderSummary();
  });
  formCard.querySelectorAll('input,select').forEach(inp=>inp.addEventListener('input', updateOrderSummary));
  const orderDateEl = document.getElementById('f-order-date');
  if(orderDateEl) orderDateEl.addEventListener('input', ()=>{ renderLineItems(); updateOrderSummary(); });
  document.getElementById('submit-order-btn').addEventListener('click', submitOrder);

  // Auto-fill delivery address (dropdown if multiple on file) + auto-select
  // the customer's current agent (from customer_agent_commission) —
  // applies to whichever select actually represents "the customer" for
  // this order type: f-primary for direct/warehouse-bound, f-customer for local.
  if(!isTransfer){
    const custSelectId = isLocal ? 'f-customer' : 'f-primary';
    wireSearchableSelect(custSelectId, customerOptions, c=>c.name, (val)=>onOrderCustomerChanged(val));
    document.getElementById('f-address-picker').addEventListener('change', e=>{
      document.getElementById('f-delivery-address').value = e.target.value;
      updateOrderSummary();
    });
  }
  updateOrderSummary();
}

function onOrderCustomerChanged(customerId){
  const picker = document.getElementById('f-address-picker');
  const addrInput = document.getElementById('f-delivery-address');
  const agentSelect = document.getElementById('f-agent');
  const addrs = addressesForCustomer(customerId);

  if(addrs.length > 1){
    picker.style.display = '';
    picker.innerHTML = addrs.map(a=>`<option value="${a.address}" ${a.is_default?'selected':''}>${a.address}</option>`).join('');
    addrInput.value = (addrs.find(a=>a.is_default) || addrs[0]).address;
  } else if(addrs.length === 1){
    picker.style.display = 'none';
    addrInput.value = addrs[0].address;
  } else {
    picker.style.display = 'none';
    addrInput.value = '';
  }

  if(agentSelect){
    const agentId = CUSTOMER_DEFAULT_AGENT[customerId];
    agentSelect.value = agentId || '';
  }
  renderLineItems();
  updateOrderSummary();
}

function currentFormCustomerId(){
  if(currentOrderType==='transfer') return null;
  const el = document.getElementById(currentOrderType==='local' ? 'f-customer' : 'f-primary');
  return el ? el.value : null;
}
function currentFormOrderDate(){
  const el = document.getElementById('f-order-date');
  return (el && el.value) ? el.value : todayStr();
}

function renderLineItems(){
  const body = document.getElementById('line-items-body');
  const isTransfer = currentOrderType==='transfer';
  const isWarehouseBound = currentOrderType==='warehouse_bound';
  const custId = currentFormCustomerId();
  const orderDate = currentFormOrderDate();
  body.innerHTML = draftItems.map((it,idx)=>{
    const price = (!isTransfer && custId) ? sellingPrice(it.product_id, custId, 'standard', orderDate) : null;
    return `
    <tr>
      <td>${renderSearchableSelect('line-item-product-'+idx, PRODUCTS, p=>p.sku_name, it.product_id, 'Search products…')}</td>
      <td><input type="number" min="1" data-idx="${idx}" data-f="quantity" value="${it.quantity}" style="width:80px"></td>
      ${!isTransfer ? `<td class="mono num" style="padding-top:12px">${price!=null?fmt(price):'—'}</td>` : ''}
      ${!isTransfer && !isWarehouseBound ? `<td><input type="number" min="0" step="0.01" data-idx="${idx}" data-f="special_price" value="${it.special_price}" placeholder="optional" style="width:110px"></td>` : ''}
      <td>${draftItems.length>1?`<button class="btn small secondary" data-remove="${idx}">×</button>`:''}</td>
    </tr>`;
  }).join('');
  draftItems.forEach((it,idx)=>{
    wireSearchableSelect('line-item-product-'+idx, PRODUCTS, p=>p.sku_name, (val)=>{
      draftItems[idx].product_id = val;
      updateOrderSummary();
    });
  });
  body.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input', e=>{
    draftItems[+e.target.dataset.idx][e.target.dataset.f] = e.target.value;
    updateOrderSummary();
  }));
  body.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', e=>{
    draftItems.splice(+e.target.dataset.remove,1); renderLineItems(); updateOrderSummary();
  }));
}

function updateOrderSummary(){
  const card = document.getElementById('order-summary-card');
  const items = draftItems.filter(it=>it.quantity && +it.quantity>0);
  if(!items.length){ card.innerHTML = `<h2>Order summary</h2><div class="empty">Add at least one line item with a quantity.</div>`; return; }
  const totalRolls = items.reduce((s,i)=>s+ +i.quantity,0);
  const custId = currentFormCustomerId();
  const orderDate = currentFormOrderDate();
  let estimatedSubtotal = 0, anyMissingPrice = false;
  const rows = items.map(r=>{
    const price = custId ? sellingPrice(r.product_id, custId, 'standard', orderDate) : null;
    if(price==null) anyMissingPrice = true;
    const lineTotal = price!=null ? price * +r.quantity : null;
    if(lineTotal!=null) estimatedSubtotal += lineTotal;
    return { name: productName(r.product_id), qty: r.quantity, price, lineTotal };
  });
  const commissionPct = custId ? CUSTOMER_COMMISSION_PCT[custId] : null;
  const estCommission = (commissionPct!=null) ? estimatedSubtotal * commissionPct : null;

  card.innerHTML = `<h2>Order summary</h2>
    <table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Selling price</th><th class="num">Line est.</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td class="num">${r.qty}</td><td class="num">${r.price!=null?fmt(r.price):'—'}</td><td class="num">${r.lineTotal!=null?fmt(r.lineTotal):'—'}</td></tr>`).join('')}</tbody></table>
    <div class="summary-line total"><span>Total rolls ordered</span><span>${totalRolls}</span></div>
    ${custId ? `<div class="summary-line"><span>Estimated subtotal (list price)</span><span>${fmt(estimatedSubtotal)}</span></div>
    <div class="summary-line"><span>Agent commission${commissionPct!=null?` (${(commissionPct*100).toFixed(2)}%)`:''}</span><span>${estCommission!=null?fmt(estCommission):'—'}</span></div>` : `<p class="helptext">Select a customer to see selling price and commission estimates.</p>`}
    ${anyMissingPrice ? `<p class="helptext" style="color:var(--negative)">No selling price on file for one or more lines — that line will bill at £0 until a price is added.</p>` : ''}
    <p class="helptext" style="margin-top:14px">Estimate at list price and current commission rate only — the real invoice depends on dispatched quantity, VAT, and discount, computed by the database once this order is Delivered.</p>`;
}

async function submitOrder(){
  const msg = document.getElementById('submit-msg');
  const isTransfer = currentOrderType==='transfer';
  const isLocal = currentOrderType==='local';
  const items = draftItems.filter(it=>it.quantity && +it.quantity>0);
  if(!items.length){ msg.textContent='Add at least one line item.'; return; }
  msg.textContent = 'Saving…';

  try{
    if(isTransfer){
      const from = document.getElementById('f-from').value, to = document.getElementById('f-to').value;
      if(from===to){ msg.textContent='Source and destination warehouse must differ.'; return; }
      const { data: transfer, error: e1 } = await sb.from('warehouse_transfers').insert({
        from_warehouse_id: from, to_warehouse_id: to,
        transfer_date: document.getElementById('f-transfer-date').value,
        reference_no: document.getElementById('f-ref').value || null,
      }).select().single();
      if(e1) throw e1;
      const { error: e2 } = await sb.from('warehouse_transfer_items').insert(
        items.map(i=>({ transfer_id: transfer.id, product_id: i.product_id, quantity: +i.quantity }))
      );
      if(e2) throw e2;
      msg.textContent = `Transfer ${transfer.reference_no||transfer.id} recorded — ledger updated by the database.`;
      draftItems=[]; renderOrderForm(todayStr());
      return;
    }

    const primaryEl = document.getElementById('f-primary');
    const customerId = isLocal ? document.getElementById('f-customer').value : primaryEl.value;
    const warehouseId = isLocal ? primaryEl.value : null;
    const destinationWarehouseId = isLocal ? null : (currentOrderType==='warehouse_bound' ? CUSTOMERS.find(c=>c.id===primaryEl.value)?.linked_warehouse_id : null);

    const common = {
      customer_id: customerId,
      customer_order_id: document.getElementById('f-cust-order-id').value || null,
      delivery_address: document.getElementById('f-delivery-address').value || null,
      order_date: document.getElementById('f-order-date').value,
      customer_requested_date: document.getElementById('f-requested-date').value || null,
      expected_delivery_date: document.getElementById('f-expected-date').value || null,
      agent_id: document.getElementById('f-agent').value || null,
      total_discount_gbp: +(document.getElementById('f-discount').value||0),
      remarks: document.getElementById('f-remarks').value || null,
      status: 'Pending',
    };

    let orderId, table, itemsTable, itemFk;
    if(isLocal){
      const { data: order, error } = await sb.from('warehouse_orders').insert({
        ...common,
        warehouse_id: warehouseId,
        vehicle_no: document.getElementById('f-vehicle-no').value || null,
        urgency_flag: document.getElementById('f-urgency').checked,
      }).select().single();
      if(error) throw error;
      orderId = order.id; table='warehouse_orders'; itemsTable='warehouse_order_items'; itemFk='warehouse_order_id';
    } else {
      const { data: order, error } = await sb.from('containers').insert({
        ...common,
        destination_warehouse_id: destinationWarehouseId,
        source_unit_id: document.getElementById('f-source-unit')?.value || null,
        expected_stuffing_date: document.getElementById('f-stuffing-date')?.value || null,
        vessel_date: document.getElementById('f-vessel-date')?.value || null,
        logistics_cost_gbp: +(document.getElementById('f-logistics')?.value||0),
      }).select().single();
      if(error) throw error;
      orderId = order.id; table='containers'; itemsTable='container_items'; itemFk='container_id';
    }

    const itemRows = items.map(i=>({
      [itemFk]: orderId, product_id: i.product_id, quantity: +i.quantity,
      special_price_per_roll_gbp: i.special_price ? +i.special_price : null,
    }));
    const { error: itemsErr } = await sb.from(itemsTable).insert(itemRows);
    if(itemsErr) throw itemsErr;

    msg.textContent = `Order placed as Pending — open it from the Order Book to advance it.`;
    draftItems=[]; renderOrderForm(todayStr());
  }catch(err){
    msg.textContent = 'Error: ' + (err.message || err);
  }
}

/* =====================================================================
   ORDER BOOK
   ===================================================================== */
const ORDER_TYPE_TABS = [
  {key:'direct', label:'Direct container'},
  {key:'warehouse_bound', label:'Container → warehouse'},
  {key:'local', label:'Local delivery'},
  {key:'transfer', label:'Transfer'},
];
let obTypeTab='direct', obStatusTab='All';
let obSearchTerm='';
let obFilters={ customer:'', agent:'', product:'', dateFrom:'', dateTo:'' };
let obFiltersOpen=false;
let cachedOrderRows = [];

async function fetchOrderBookRows(){
  const [containersRes, whOrdersRes, transfersRes, cItemsRes, woItemsRes] = await Promise.all([
    sb.from('containers').select('id,order_no,container_no,order_date,delivery_address,customer_requested_date,expected_delivery_date,delivered_date,invoice_no,remarks,agent_id,status,invoice_value_gbp,destination_warehouse_id,customer_id'),
    sb.from('warehouse_orders').select('id,order_no,order_date,delivery_address,customer_requested_date,expected_delivery_date,delivered_date,invoice_no,remarks,agent_id,status,invoice_value_gbp,warehouse_id,customer_id'),
    sb.from('warehouse_transfers').select('id,reference_no,transfer_date,from_warehouse_id,to_warehouse_id'),
    sb.from('container_items').select('container_id,product_id,quantity'),
    sb.from('warehouse_order_items').select('warehouse_order_id,product_id,quantity'),
  ]);

  // group items by order id, building the same "consolidated" comma-joined
  // summary the old AppSheet columns showed (Product Category (Consolidated) /
  // Quantity (Consolidated)), computed here instead of stored redundantly
  const itemsByOrder = {};
  (cItemsRes.data||[]).forEach(it=>{
    (itemsByOrder[it.container_id] = itemsByOrder[it.container_id] || []).push(it);
  });
  (woItemsRes.data||[]).forEach(it=>{
    (itemsByOrder[it.warehouse_order_id] = itemsByOrder[it.warehouse_order_id] || []).push(it);
  });
  function consolidated(orderId){
    const its = itemsByOrder[orderId] || [];
    return {
      products: its.map(i=>productName(i.product_id)).join(', '),
      qtys: its.map(i=>i.quantity).join(', '),
    };
  }

  const rows = [];
  (containersRes.data||[]).forEach(c=>{
    const cons = consolidated(c.id);
    rows.push({
      typeKey: c.destination_warehouse_id?'warehouse_bound':'direct',
      type: c.destination_warehouse_id?'Container → warehouse':'Direct container',
      id: c.order_no, refId: c.id, isLocal:false,
      customerName: c.destination_warehouse_id?warehouseName(c.destination_warehouse_id):customerName(c.customer_id),
      who: c.destination_warehouse_id?warehouseName(c.destination_warehouse_id):customerName(c.customer_id),
      agentName: agentName(c.agent_id),
      date: c.order_date, status: c.status, value: c.invoice_value_gbp,
      deliveryAddress: c.delivery_address, customerRequestedDate: c.customer_requested_date,
      expectedDeliveryDate: c.expected_delivery_date, deliveredDate: c.delivered_date,
      invoiceNo: c.invoice_no, remarks: c.remarks,
      products: cons.products, qtys: cons.qtys,
    });
  });
  (whOrdersRes.data||[]).forEach(o=>{
    const cons = consolidated(o.id);
    rows.push({
      typeKey:'local', type:'Local delivery', id:o.order_no, refId:o.id, isLocal:true,
      customerName: customerName(o.customer_id),
      who: customerName(o.customer_id)+' ← '+warehouseName(o.warehouse_id),
      agentName: agentName(o.agent_id),
      date:o.order_date, status:o.status, value:o.invoice_value_gbp,
      deliveryAddress: o.delivery_address, customerRequestedDate: o.customer_requested_date,
      expectedDeliveryDate: o.expected_delivery_date, deliveredDate: o.delivered_date,
      invoiceNo: o.invoice_no, remarks: o.remarks,
      products: cons.products, qtys: cons.qtys,
    });
  });
  (transfersRes.data||[]).forEach(t=>rows.push({
    typeKey:'transfer', type:'Transfer', id:t.reference_no||t.id, refId:t.id, isLocal:null,
    customerName:'', who: warehouseName(t.from_warehouse_id)+' → '+warehouseName(t.to_warehouse_id),
    agentName:'', date:t.transfer_date, status:'Processed', value:null,
    deliveryAddress:'', customerRequestedDate:'', expectedDeliveryDate:'', deliveredDate:'',
    invoiceNo:'', remarks:'', products:'', qtys:'',
  }));
  return rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

async function renderOrderList(){
  const el = document.getElementById('view-orderlist');
  el.innerHTML = `<div class="card"><div class="loading">Loading order book…</div></div>`;
  cachedOrderRows = await fetchOrderBookRows();
  drawOrderList();
}
function matchesSearch(r, term){
  if(!term) return true;
  const hay = [r.id, r.customerName, r.who, r.agentName, r.products, r.deliveryAddress,
    r.invoiceNo, r.remarks].join(' ').toLowerCase();
  return hay.includes(term.toLowerCase());
}
function matchesFilters(r, f){
  if(f.customer && r.customerName !== f.customer) return false;
  if(f.agent && r.agentName !== f.agent) return false;
  if(f.product && !(r.products||'').toLowerCase().includes(f.product.toLowerCase())) return false;
  if(f.dateFrom && (!r.date || r.date < f.dateFrom)) return false;
  if(f.dateTo && (!r.date || r.date > f.dateTo)) return false;
  return true;
}

function drawOrderList(){
  const el = document.getElementById('view-orderlist');
  const allRows = cachedOrderRows;
  const typeRows = allRows.filter(r=>r.typeKey===obTypeTab);
  const hasStatusTabs = obTypeTab !== 'transfer';
  const statusTabs = hasStatusTabs ? ['All', ...ALL_STATUSES] : null;
  let visibleRows = hasStatusTabs && obStatusTab!=='All' ? typeRows.filter(r=>r.status===obStatusTab) : typeRows;
  visibleRows = visibleRows.filter(r=>matchesSearch(r, obSearchTerm) && matchesFilters(r, obFilters));

  const customerOptionsForFilter = [...new Set(typeRows.map(r=>r.customerName).filter(Boolean))].sort();
  const agentOptionsForFilter = [...new Set(typeRows.map(r=>r.agentName).filter(Boolean))].sort();
  const activeFilterCount = Object.values(obFilters).filter(Boolean).length;

  el.innerHTML = `<div class="card">
    <h2>Order book (${allRows.length})</h2>
    <p class="helptext" style="margin-bottom:14px">Click any order to open it and edit real data — every change here writes to Supabase.</p>
    <div class="field-row" style="margin-bottom:12px">
      <div class="field" style="flex:2"><input type="text" id="ob-search" placeholder="Search customer, order no., product, address, remarks…" value="${obSearchTerm}"></div>
      <div class="field" style="flex:0 0 auto"><button class="btn secondary" id="ob-filters-toggle">Filters${activeFilterCount?` (${activeFilterCount})`:''}</button></div>
    </div>
    ${obFiltersOpen ? `<div class="field-row" style="background:var(--field-bg);padding:12px;border-radius:2px;margin-bottom:12px">
      <div class="field"><label>Customer</label><select id="ob-f-customer"><option value="">— all —</option>${customerOptionsForFilter.map(c=>`<option ${c===obFilters.customer?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Agent</label><select id="ob-f-agent"><option value="">— all —</option>${agentOptionsForFilter.map(a=>`<option ${a===obFilters.agent?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label>Product contains</label><input type="text" id="ob-f-product" value="${obFilters.product}" placeholder="e.g. Footlove"></div>
      <div class="field"><label>Order date from</label><input type="date" id="ob-f-datefrom" value="${obFilters.dateFrom}"></div>
      <div class="field"><label>Order date to</label><input type="date" id="ob-f-dateto" value="${obFilters.dateTo}"></div>
      <div class="field" style="flex:0 0 auto;justify-content:flex-end"><button class="btn small secondary" id="ob-filters-clear" style="margin-top:16px">Clear filters</button></div>
    </div>` : ''}
    <div class="order-type-tabs">${ORDER_TYPE_TABS.map(t=>{
      const n = allRows.filter(r=>r.typeKey===t.key).length;
      return `<button data-t="${t.key}" class="${obTypeTab===t.key?'active':''}">${t.label} (${n})</button>`;
    }).join('')}</div>
    ${hasStatusTabs ? `<div class="subtabs" style="margin-bottom:16px">${statusTabs.map(s=>{
      const n = s==='All'?typeRows.length:typeRows.filter(r=>r.status===s).length;
      return `<button data-s="${s}" class="${obStatusTab===s?'active':''}">${s} (${n})</button>`;
    }).join('')}</div>` : ''}
    ${visibleRows.length? `<table><thead><tr><th>Reference</th><th>${obTypeTab==='transfer'?'Route':'Customer'}</th>
      <th>Products</th><th>Qty</th><th>Order date</th><th>Requested date</th><th>Status</th><th>Remarks</th></tr></thead>
    <tbody>${visibleRows.map((r,i)=>`<tr class="order-row" data-idx="${i}"><td class="mono"><span style="color:var(--accent-ink);text-decoration:underline">${r.id}</span></td>
      <td>${r.who}</td>
      <td style="max-width:220px">${r.products||'—'}</td>
      <td class="mono">${r.qtys||'—'}</td>
      <td class="mono">${r.date||''}</td>
      <td class="mono">${r.customerRequestedDate||'—'}</td>
      <td><span class="badge ${DELIVERED_OR_LATER.includes(r.status)||r.status==='Processed'?'delivered':''}">${r.status}</span></td>
      <td style="max-width:200px">${r.remarks||'—'}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">No orders match${obSearchTerm||activeFilterCount?' your search/filters':' this status'}.</div>`}
  </div>`;

  el.querySelectorAll('.order-type-tabs button').forEach(b=>b.addEventListener('click', ()=>{ obTypeTab=b.dataset.t; obStatusTab='All'; drawOrderList(); }));
  el.querySelectorAll('.subtabs button').forEach(b=>b.addEventListener('click', ()=>{ obStatusTab=b.dataset.s; drawOrderList(); }));
  document.getElementById('ob-search').addEventListener('input', e=>{ obSearchTerm=e.target.value; drawOrderList(); });
  document.getElementById('ob-search').focus();
  document.getElementById('ob-search').setSelectionRange(obSearchTerm.length, obSearchTerm.length);
  document.getElementById('ob-filters-toggle').addEventListener('click', ()=>{ obFiltersOpen=!obFiltersOpen; drawOrderList(); });
  if(obFiltersOpen){
    document.getElementById('ob-f-customer').addEventListener('change', e=>{ obFilters.customer=e.target.value; drawOrderList(); });
    document.getElementById('ob-f-agent').addEventListener('change', e=>{ obFilters.agent=e.target.value; drawOrderList(); });
    document.getElementById('ob-f-product').addEventListener('input', e=>{ obFilters.product=e.target.value; drawOrderList(); });
    document.getElementById('ob-f-datefrom').addEventListener('change', e=>{ obFilters.dateFrom=e.target.value; drawOrderList(); });
    document.getElementById('ob-f-dateto').addEventListener('change', e=>{ obFilters.dateTo=e.target.value; drawOrderList(); });
    document.getElementById('ob-filters-clear').addEventListener('click', ()=>{ obFilters={customer:'',agent:'',product:'',dateFrom:'',dateTo:''}; drawOrderList(); });
  }
  el.querySelectorAll('.order-row').forEach(tr=>tr.addEventListener('click', ()=>{
    const r = visibleRows[+tr.dataset.idx];
    if(r.typeKey==='transfer') return; // transfers process instantly, nothing to open
    openOrderDetail(r.typeKey, r.isLocal, r.refId);
  }));
}

/* =====================================================================
   ORDER DETAIL — real fetch + real update, no client-side math
   ===================================================================== */
let detailTarget = null;

async function openOrderDetail(typeKey, isLocal, id){
  ['order','orderlist','dashboard'].forEach(v=>document.getElementById('view-'+v).style.display='none');
  const el = document.getElementById('view-orderdetail');
  el.style.display='block';
  el.innerHTML = `<div class="card"><div class="loading">Loading order…</div></div>`;
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));

  const table = isLocal ? 'warehouse_orders' : 'containers';
  const itemsTable = isLocal ? 'warehouse_order_items' : 'container_items';
  const itemFk = isLocal ? 'warehouse_order_id' : 'container_id';

  const [{data: order, error: e1}, {data: items, error: e2}] = await Promise.all([
    sb.from(table).select('*').eq('id', id).single(),
    sb.from(itemsTable).select('*').eq(itemFk, id),
  ]);
  if(e1 || e2){ el.innerHTML = `<div class="card"><div class="warn-box">Error loading order: ${(e1||e2).message}</div></div>`; return; }

  detailTarget = { typeKey, isLocal, table, itemsTable, itemFk, order, items: items||[] };
  renderOrderDetail();
}

function closeOrderDetail(){
  detailTarget = null;
  document.getElementById('view-orderdetail').style.display='none';
  document.getElementById('view-orderlist').style.display='block';
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active', x.dataset.view==='orderlist'));
  drawOrderList();
}

function renderDetailItems(){
  const body = document.getElementById('detail-items-body');
  const { items, order: o, isLocal } = detailTarget;
  body.innerHTML = items.map((it,idx)=>{
    const price = o.customer_id ? sellingPrice(it.product_id, o.customer_id, isLocal?(it.transaction_type||'standard'):'standard', o.order_date) : null;
    return `
    <tr>
      <td>${renderSearchableSelect('detail-item-product-'+idx, PRODUCTS, p=>p.sku_name, it.product_id, 'Search products…')}</td>
      <td><input type="number" min="0" data-idx="${idx}" data-f="quantity" value="${it.quantity}" style="width:80px;text-align:right"></td>
      <td><input type="number" min="0" data-idx="${idx}" data-f="dispatched_quantity" value="${it.dispatched_quantity||0}" style="width:80px;text-align:right"></td>
      <td class="mono num">${price!=null?fmt(price):'—'}</td>
      <td><input type="number" min="0" step="0.01" data-idx="${idx}" data-f="special_price_per_roll_gbp" value="${it.special_price_per_roll_gbp||''}" style="width:90px;text-align:right" placeholder="optional"></td>
      <td>${items.length>1?`<button class="btn small secondary" data-remove="${idx}">×</button>`:''}</td>
    </tr>`;
  }).join('');
  items.forEach((it,idx)=>{
    wireSearchableSelect('detail-item-product-'+idx, PRODUCTS, p=>p.sku_name, (val)=>{
      detailTarget.items[idx].product_id = val;
      renderDetailSummary();
    });
  });
  body.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input', e=>{
    const idx=+e.target.dataset.idx, f=e.target.dataset.f;
    detailTarget.items[idx][f] = e.target.value===''?null:+e.target.value;
    renderDetailSummary();
  }));
  body.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', e=>{
    const idx = +e.target.dataset.remove;
    const removed = detailTarget.items.splice(idx,1)[0];
    if(removed.id) detailTarget._deletedItemIds = [...(detailTarget._deletedItemIds||[]), removed.id];
    renderDetailItems();
    renderDetailSummary();
  }));
}

async function renderDetailSummary(){
  const box = document.getElementById('detail-summary');
  const { isLocal, order: o, items } = detailTarget;
  const commissionPct = o.customer_id ? CUSTOMER_COMMISSION_PCT[o.customer_id] : null;
  const isWarehouseBound = !isLocal && !!o.destination_warehouse_id;

  let breakdownHtml, headerLabel;

  if(isWarehouseBound){
    // CONFIRMED FIX: a container going TO a warehouse is not a sale — it has
    // no real customer, no real invoice, no real profit. That figure was
    // being shown here by mistake (an accidental byproduct of the invoicing
    // trigger not caring about destination). Profit on this stock is only
    // ever recognized later, on whichever local delivery order eventually
    // draws it down from the warehouse ledger. Show what's actually real
    // here: the landed cost this container contributes to that ledger.
    // NOTE: this is a LIVE preview using TODAY's price — the real ledger
    // blend already happened, permanently, using the price that was true
    // at the moment this container was actually marked Delivered. These
    // two numbers can legitimately differ; this panel does not show or
    // claim to show the frozen historical ledger value.
    headerLabel = 'Landed cost contributed to warehouse ledger';
    const hasDispatchDate = !!o.dispatch_date;
    const exTotal = hasDispatchDate
      ? items.reduce((s,it)=>s + (it.dispatched_quantity||0) * (exFactoryPrice(it.product_id, o.source_unit_id, o.dispatch_date) ?? 0), 0)
      : 0;
    const totalRolls = items.reduce((s,it)=>s+(it.dispatched_quantity||0),0);
    const logisticsShare = totalRolls>0 ? (o.logistics_cost_gbp||0)/totalRolls : 0;
    breakdownHtml = `
      <table><thead><tr><th>Product</th><th class="num">Ex-factory £/roll (live)</th><th class="num">+ Logistics share</th><th class="num">= Landed £/roll</th></tr></thead>
      <tbody>${items.map(it=>{
        const px = hasDispatchDate ? exFactoryPrice(it.product_id, o.source_unit_id, o.dispatch_date) : null;
        const landed = (px!=null && hasDispatchDate) ? px + logisticsShare : null;
        return `<tr><td>${productName(it.product_id)}</td><td class="num">${px!=null?fmt(px):'—'}</td><td class="num">${fmt(logisticsShare)}</td><td class="num">${landed!=null?fmt(landed):'—'}</td></tr>`;
      }).join('')}</tbody></table>
      ${!hasDispatchDate ? `<p class="helptext" style="color:var(--negative)">No dispatch date set — landed cost shows £0 until one is entered.</p>` : ''}
      <div class="summary-line"><span>Total ex-factory cost (live, as of dispatch date)</span><span class="mono">${fmt(exTotal)}</span></div>
      <div class="summary-line"><span>+ Logistics cost</span><span class="mono">${fmt(o.logistics_cost_gbp)}</span></div>
      <div class="summary-line total"><span>= Total landed cost this container adds</span><span class="mono">${fmt(exTotal + (o.logistics_cost_gbp||0))}</span></div>
      <p class="helptext" style="margin-top:14px">No invoice or profit here — this container isn't a sale. Check the Warehouse ledger tab on the dashboard for the actual blended average cost, and Local delivery P&L for real profit once this stock is sold on.</p>`;
    box.innerHTML = `<h2>${headerLabel}</h2>${breakdownHtml}`;
    return;
  }

  if(!isLocal){
    // DIRECT CONTAINERS: always live, never frozen — CONFIRMED decision.
    // £0 ex-factory cost until dispatch_date is set; moves automatically
    // after that if dispatch date, source plant, or dispatched quantity change.
    headerLabel = 'How this profit is calculated (live)';
    const hasDispatchDate = !!o.dispatch_date;
    const exTotal = hasDispatchDate
      ? items.reduce((s,it)=>s + (it.dispatched_quantity||0) * (exFactoryPrice(it.product_id, o.source_unit_id, o.dispatch_date) ?? 0), 0)
      : 0;
    const totalCost = exTotal + (o.logistics_cost_gbp||0);
    const profit = (o.invoice_value_gbp||0) - (o.commission_value_gbp||0) - totalCost;
    breakdownHtml = `
      <table><thead><tr><th>Product</th><th class="num">Ex-factory £/roll</th><th class="num">Ex-factory cost</th></tr></thead>
      <tbody>${items.map(it=>{
        const px = hasDispatchDate ? exFactoryPrice(it.product_id, o.source_unit_id, o.dispatch_date) : null;
        const cost = (px!=null && hasDispatchDate) ? px * (it.dispatched_quantity||0) : 0;
        return `<tr><td>${productName(it.product_id)}</td><td class="num">${px!=null?fmt(px):'—'}</td><td class="num">${fmt(cost)}</td></tr>`;
      }).join('')}</tbody></table>
      ${!hasDispatchDate ? `<p class="helptext" style="color:var(--negative)">No dispatch date set — ex-factory cost shows £0 until one is entered.</p>` : ''}
      <div class="summary-line"><span>Total ex-factory cost</span><span class="mono">${fmt(exTotal)}</span></div>
      <div class="summary-line"><span>+ Logistics cost</span><span class="mono">${fmt(o.logistics_cost_gbp)}</span></div>
      <div class="summary-line total"><span>= Total cost</span><span class="mono">${fmt(totalCost)}</span></div>
      <div class="summary-line" style="margin-top:10px"><span>Invoice value (incl. VAT, after discount)</span><span class="mono">${fmt(o.invoice_value_gbp)}</span></div>
      <div class="summary-line"><span>− Commission${commissionPct!=null?` (${(commissionPct*100).toFixed(2)}%)`:''}</span><span class="mono">${fmt(o.commission_value_gbp)}</span></div>
      <div class="summary-line total"><span>− Total cost</span><span class="mono">${fmt(totalCost)}</span></div>
      <div class="summary-line total ${profit>=0?'pos':'neg'}"><span>= Profit</span><span class="mono">${fmt(profit)}</span></div>
      <p class="helptext" style="margin-top:14px">Ex-factory cost is computed live from the dispatch date shown above — not frozen. It will change automatically if dispatch date, source plant, dispatched quantity, or the underlying price data changes.</p>`;
  } else {
    // LOCAL DELIVERY: the £/roll RATE (landed_cost_snapshot_gbp) and
    // overhead stay frozen — real economic facts. The TOTAL and the trip
    // delivery-cost SHARE are computed live here (CONFIRMED decision):
    // the total must track dispatched_quantity if corrected later, and the
    // trip share must recalculate if another order joins the same trip.
    const processed = items.some(it=>it.snapshot_written_at);
    headerLabel = processed ? 'How this profit is calculated (partly live)' : 'Estimated figures';
    if(processed){
      const totalOrderQty = items.reduce((s,it)=>s+(it.dispatched_quantity||0),0);
      let tripDeliveryTotal = 0;
      try{
        const { data } = await sb.rpc('fn_delivery_cost_for_order', { p_warehouse_order_id: o.id });
        tripDeliveryTotal = data || 0;
      }catch(e){ tripDeliveryTotal = 0; }
      const itemsWithLive = items.map(it=>({
        ...it,
        landedTotalLive: round2((it.landed_cost_snapshot_gbp||0) * (it.dispatched_quantity||0)),
        deliveryShareLive: totalOrderQty>0 ? round2(tripDeliveryTotal * (it.dispatched_quantity||0) / totalOrderQty) : 0,
      }));
      const landed = itemsWithLive.reduce((s,it)=>s+it.landedTotalLive,0);
      const overhead = items.reduce((s,it)=>s+(it.overhead_snapshot_gbp||0),0);
      const delivery = itemsWithLive.reduce((s,it)=>s+it.deliveryShareLive,0);
      const totalCost = landed + overhead + delivery;
      breakdownHtml = `
        <table><thead><tr><th>Product</th><th class="num">Landed (rate frozen, total live)</th><th class="num">Overhead</th><th class="num">Delivery (live)</th></tr></thead>
        <tbody>${itemsWithLive.map(it=>`<tr><td>${productName(it.product_id)}</td><td class="num">${fmt(it.landedTotalLive)}</td><td class="num">${fmt(it.overhead_snapshot_gbp)}</td><td class="num">${fmt(it.deliveryShareLive)}</td></tr>`).join('')}</tbody></table>
        <div class="summary-line"><span>Landed cost (£/roll frozen at delivery × current dispatched qty)</span><span class="mono">${fmt(landed)}</span></div>
        <div class="summary-line"><span>+ Warehouse overhead</span><span class="mono">${fmt(overhead)}</span></div>
        <div class="summary-line"><span>+ Local delivery cost (this order's live share of its trip)</span><span class="mono">${fmt(delivery)}</span></div>
        <div class="summary-line total"><span>= Total cost</span><span class="mono">${fmt(totalCost)}</span></div>
        <div class="summary-line" style="margin-top:10px"><span>Invoice value (incl. VAT, after discount)</span><span class="mono">${fmt(o.invoice_value_gbp)}</span></div>
        <div class="summary-line"><span>− Commission${commissionPct!=null?` (${(commissionPct*100).toFixed(2)}%)`:''}</span><span class="mono">${fmt(o.commission_value_gbp)}</span></div>
        <div class="summary-line total"><span>− Total cost</span><span class="mono">${fmt(totalCost)}</span></div>
        <div class="summary-line total ${((o.invoice_value_gbp||0)-(o.commission_value_gbp||0)-totalCost)>=0?'pos':'neg'}"><span>= Profit</span><span class="mono">${fmt((o.invoice_value_gbp||0)-(o.commission_value_gbp||0)-totalCost)}</span></div>
        <p class="helptext" style="margin-top:14px">The £/roll landed cost and overhead are frozen at the moment this order was delivered. The total and the delivery-trip share recompute live — edit dispatched quantity, or link another order to the same trip, and these numbers update automatically next time you open this order.</p>`;
    } else {
      let estSubtotal = 0;
      items.forEach(it=>{
        const price = o.customer_id ? sellingPrice(it.product_id, o.customer_id, it.transaction_type||'standard', o.order_date) : null;
        if(price!=null) estSubtotal += price * (it.quantity||0);
      });
      const estCommission = commissionPct!=null ? estSubtotal * commissionPct : null;
      breakdownHtml = `
        <div class="summary-line"><span>Estimated subtotal (list price × qty)</span><span class="mono">${fmt(estSubtotal)}</span></div>
        <div class="summary-line"><span>Agent commission${commissionPct!=null?` (${(commissionPct*100).toFixed(2)}%)`:''}</span><span class="mono">${estCommission!=null?fmt(estCommission):'—'}</span></div>
        <p class="helptext" style="margin-top:10px">Landed cost isn't determined yet — that freezes once this order is Delivered, using dispatched quantity at that point.</p>`;
    }
  }

  box.innerHTML = `<h2>${headerLabel}</h2>
    <div class="summary-line"><span>Invoice value on file</span><span class="v mono">${fmt(o.invoice_value_gbp)}</span></div>
    <div class="summary-line"><span>Commission on file</span><span class="v mono">${fmt(o.commission_value_gbp)}</span></div>
    <h2 style="margin-top:18px">Breakdown</h2>
    ${breakdownHtml}`;
}

  const saveBtn = document.getElementById('detail-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  try{
    const newStatus = document.getElementById('d-status').value;
    const updatePayload = {
      customer_id: document.getElementById('d-customer').value,
      agent_id: document.getElementById('d-agent').value || null,
      customer_order_id: document.getElementById('d-cust-order-id').value || null,
      delivery_address: document.getElementById('d-delivery-address').value || null,
      customer_requested_date: document.getElementById('d-requested-date').value || null,
      expected_delivery_date: document.getElementById('d-expected-date').value || null,
      order_date: document.getElementById('d-order-date').value,
      total_discount_gbp: +(document.getElementById('d-discount').value||0),
      remarks: document.getElementById('d-remarks').value || null,
      status: newStatus,
    };
    const today = todayStr();
    if(!isLocal){
      const manualDispatchDate = document.getElementById('d-dispatch-date')?.value || null;
      updatePayload.dispatch_date = manualDispatchDate || (newStatus === 'In Transit' && !o.dispatch_date ? today : o.dispatch_date || null);
    }
    if(DELIVERED_OR_LATER.includes(newStatus) && !o.delivered_date) updatePayload.delivered_date = today;
    if(newStatus === 'Paid' && !o.paid_date) updatePayload.paid_date = today;
    if(!isLocal){
      updatePayload.logistics_cost_gbp = +(document.getElementById('d-logistics')?.value||0);
      updatePayload.source_unit_id = document.getElementById('d-source-unit')?.value || null;
      updatePayload.container_no = document.getElementById('d-container-no')?.value || null;
      updatePayload.expected_stuffing_date = document.getElementById('d-stuffing-date')?.value || null;
      updatePayload.vessel_date = document.getElementById('d-vessel-date')?.value || null;
    } else {
      updatePayload.vehicle_no = document.getElementById('d-vehicle-no').value || null;
      updatePayload.urgency_flag = document.getElementById('d-urgency').checked;
      updatePayload.dispatch_date = document.getElementById('d-dispatch-date-local')?.value || null;

      const tripChoice = document.getElementById('d-delivery-trip')?.value;
      if(tripChoice === '__new__'){
        const { data: trip, error: tripErr } = await sb.from('delivery_trips').insert({
          warehouse_id: o.warehouse_id,
          trip_date: document.getElementById('d-trip-date').value,
          total_delivery_partner_cost_gbp: +(document.getElementById('d-trip-cost').value||0),
          notes: document.getElementById('d-trip-notes').value || null,
        }).select().single();
        if(tripErr) throw tripErr;
        updatePayload.delivery_trip_id = trip.id;
      } else {
        updatePayload.delivery_trip_id = tripChoice || null;
      }
    }

    // CRITICAL ORDERING: items must be saved BEFORE the order/status update.
    // The ex-factory freeze trigger fires the instant status becomes In
    // Transit and reads container_items.dispatched_quantity straight from
    // the database AT THAT MOMENT — if the order update ran first, it would
    // freeze against whatever dispatched_quantity was already saved from
    // BEFORE this save (0, on a brand new order), not the value just typed
    // into this same form. Saving items first guarantees the freeze sees
    // the real, current numbers.
    for(const it of items){
      const payload = { product_id: it.product_id, quantity: it.quantity,
        dispatched_quantity: it.dispatched_quantity||0, special_price_per_roll_gbp: it.special_price_per_roll_gbp };
      if(it.id){
        const { error } = await sb.from(itemsTable).update(payload).eq('id', it.id);
        if(error) throw error;
      } else {
        const { error } = await sb.from(itemsTable).insert({ ...payload, [itemFk]: o.id });
        if(error) throw error;
      }
    }
    if(detailTarget._deletedItemIds?.length){
      const { error } = await sb.from(itemsTable).delete().in('id', detailTarget._deletedItemIds);
      if(error) throw error;
    }

    const { error: orderErr } = await sb.from(table).update(updatePayload).eq('id', o.id);
    if(orderErr) throw orderErr;

    // re-fetch so the summary shows what the database actually computed
    const [{data: freshOrder}, {data: freshItems}] = await Promise.all([
      sb.from(table).select('*').eq('id', o.id).single(),
      sb.from(itemsTable).select('*').eq(itemFk, o.id),
    ]);
    detailTarget.order = freshOrder; detailTarget.items = freshItems||[]; detailTarget._deletedItemIds = [];
    renderOrderDetail();
  }catch(err){
    alert('Save failed: ' + (err.message||err));
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = 'Save changes';
  }
}

/* =====================================================================
   DASHBOARD — reads straight from the SQL views, no client-side math at all
   ===================================================================== */
let dashSubtab = 'pipeline';

async function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  el.innerHTML = `<div class="loading">Loading dashboard…</div>`;

  const [pipelineRes, ledgerRes, directRes, localRes, overheadRes] = await Promise.all([
    sb.from('v_order_status_pipeline').select('*'),
    sb.from('v_warehouse_ledger').select('*'),
    sb.from('v_direct_profit').select('*'),
    sb.from('v_warehouse_local_profit').select('*'),
    sb.from('warehouse_overhead').select('id,warehouse_id,monthly_amount_gbp,effective_date').order('effective_date', {ascending:false}),
  ]);
  const pipeline = pipelineRes.data||[], ledger = ledgerRes.data||[], direct = directRes.data||[], local = localRes.data||[];
  const overhead = overheadRes.data||[];

  const totalDirectProfit = direct.reduce((s,r)=>s+(r.profit_gbp||0),0);
  const totalLocalProfit = local.reduce((s,r)=>s+(r.profit_gbp||0),0);
  const totalRollsOnHand = ledger.reduce((s,r)=>s+(r.qty_on_hand||0),0);

  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="label">Direct channel profit</div><div class="value ${totalDirectProfit>=0?'pos':'neg'}">${fmt(totalDirectProfit)}</div></div>
      <div class="kpi"><div class="label">Local delivery profit</div><div class="value ${totalLocalProfit>=0?'pos':'neg'}">${fmt(totalLocalProfit)}</div></div>
      <div class="kpi"><div class="label">Rolls on hand (all warehouses)</div><div class="value">${totalRollsOnHand}</div></div>
      <div class="kpi"><div class="label">Open pricing warnings</div><div class="value">—</div></div>
    </div>
    <div class="subtabs">
      <button data-s="pipeline" class="${dashSubtab==='pipeline'?'active':''}">Order pipeline</button>
      <button data-s="ledger" class="${dashSubtab==='ledger'?'active':''}">Warehouse ledger</button>
      <button data-s="direct" class="${dashSubtab==='direct'?'active':''}">Direct P&amp;L</button>
      <button data-s="local" class="${dashSubtab==='local'?'active':''}">Local delivery P&amp;L</button>
    </div>
    <div class="card" id="dash-content"></div>
  `;
  el.querySelectorAll('.subtabs button').forEach(b=>b.addEventListener('click', ()=>{
    dashSubtab=b.dataset.s;
    el.querySelectorAll('.subtabs button').forEach(x=>x.classList.toggle('active', x.dataset.s===dashSubtab));
    drawDashboardContent({pipeline,ledger,direct,local,overhead});
  }));
  drawDashboardContent({pipeline,ledger,direct,local,overhead});
}

function drawDashboardContent(data){
  const content = document.getElementById('dash-content');
  const { pipeline, ledger, direct, local, overhead } = data;
  if(dashSubtab==='pipeline'){
    const channels = [...new Set(pipeline.map(r=>r.channel))];
    content.innerHTML = `<h2>Orders by status, per channel</h2>
      ${pipeline.length? `<table><thead><tr><th>Channel</th><th>Status</th><th class="num">Orders</th></tr></thead>
      <tbody>${pipeline.map(r=>`<tr><td>${r.channel}</td><td>${r.status}</td><td class="num">${r.order_count}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No orders yet.</div>`}`;
  } else if(dashSubtab==='ledger'){
    content.innerHTML = `<h2>Live weighted-average landed cost per (warehouse, product)</h2>
      ${ledger.length? `<table><thead><tr><th>Warehouse</th><th>Product</th><th class="num">Qty on hand</th><th class="num">Avg cost/roll</th></tr></thead>
      <tbody>${ledger.map(r=>`<tr><td>${r.warehouse_name}</td><td>${r.sku_name}</td><td class="num">${r.qty_on_hand}</td><td class="num">${fmt(r.avg_cost_gbp)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No warehouse stock movements yet.</div>`}
      <h2 style="margin-top:24px">Warehouse overhead <span style="font-weight:400;color:var(--ink-soft);font-size:12px">(rent, staff, other fixed monthly costs — spread per roll dispatched that month)</span></h2>
      ${overhead.length? `<table><thead><tr><th>Warehouse</th><th class="num">Monthly amount</th><th>Effective from</th></tr></thead>
      <tbody>${overhead.map(o=>`<tr><td>${warehouseName(o.warehouse_id)}</td><td class="num">${fmt(o.monthly_amount_gbp)}</td><td class="mono">${o.effective_date}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No overhead rates set yet — local delivery orders will show £0 overhead until one is added below.</div>`}
      <div class="field-row" style="margin-top:14px">
        <div class="field"><label>Warehouse</label><select id="oh-warehouse">${optionsHtml(WAREHOUSES,w=>w.name)}</select></div>
        <div class="field"><label>Monthly amount (£)</label><input type="number" id="oh-amount" min="0" step="1" placeholder="e.g. 4500"></div>
        <div class="field"><label>Effective from</label><input type="date" id="oh-effective" value="${todayStr()}"></div>
        <div class="field" style="flex:0 0 auto;justify-content:flex-end"><button class="btn small" id="oh-add" style="margin-top:16px">Add rate</button></div>
      </div>
      <p class="helptext">Adding a new rate doesn't overwrite the old one — it takes effect from its date onward, same as ex-factory and selling prices. Past deliveries already frozen aren't affected.</p>`;
    document.getElementById('oh-add').addEventListener('click', async ()=>{
      const btn = document.getElementById('oh-add');
      btn.disabled = true;
      const { error } = await sb.from('warehouse_overhead').insert({
        warehouse_id: document.getElementById('oh-warehouse').value,
        monthly_amount_gbp: +(document.getElementById('oh-amount').value||0),
        effective_date: document.getElementById('oh-effective').value,
      });
      if(error){ alert('Could not add rate: '+error.message); btn.disabled=false; return; }
      await renderDashboard();
    });
  } else if(dashSubtab==='direct'){
    content.innerHTML = `<h2>Direct-to-customer P&amp;L</h2>
      <p class="helptext" style="margin-bottom:10px">Click any row to see exactly how its cost and profit were calculated.</p>
      ${direct.length? `<table><thead><tr><th>Container</th><th>Customer</th><th class="num">Rolls</th><th class="num">Cost</th><th class="num">Invoice</th><th class="num">Profit</th></tr></thead>
      <tbody>${direct.map((r,i)=>`<tr class="pl-row" data-idx="${i}" style="cursor:pointer"><td class="mono"><span style="color:var(--accent-ink);text-decoration:underline">${r.order_no}</span></td><td>${r.customer_name}</td><td class="num">${r.total_rolls}</td>
        <td class="num">${fmt(r.total_cost_gbp)}</td><td class="num">${fmt(r.invoice_value_gbp)}</td>
        <td class="num ${r.profit_gbp>=0?'pos':'neg'}">${fmt(r.profit_gbp)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No direct containers yet.</div>`}`;
    content.querySelectorAll('.pl-row').forEach(tr=>tr.addEventListener('click', ()=>{
      openOrderDetail('direct', false, direct[+tr.dataset.idx].container_id);
    }));
  } else {
    content.innerHTML = `<h2>Local delivery P&amp;L</h2>
      <p class="helptext" style="margin-bottom:10px">Click any row to see exactly how its cost and profit were calculated.</p>
      ${local.length? `<table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Invoice</th><th class="num">Profit</th></tr></thead>
      <tbody>${local.map((r,i)=>`<tr class="pl-row" data-idx="${i}" style="cursor:pointer"><td class="mono"><span style="color:var(--accent-ink);text-decoration:underline">${r.order_no}</span></td><td>${r.customer_name}</td><td>${r.sku_name}</td>
        <td class="num">${r.quantity}</td><td class="num">${fmt(r.fully_loaded_cost_gbp)}</td><td class="num">${fmt(r.line_total_gbp)}</td>
        <td class="num ${r.profit_gbp>=0?'pos':'neg'}">${fmt(r.profit_gbp)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No delivered local orders yet.</div>`}`;
    content.querySelectorAll('.pl-row').forEach(tr=>tr.addEventListener('click', ()=>{
      openOrderDetail('local', true, local[+tr.dataset.idx].warehouse_order_id);
    }));
  }
}

checkAuth();
